<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Wither Away</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap">
    <script type="module" src="/src/shared/arcade-button.ts"></script>
</head>

<body>
    <canvas id="view" aria-label="The game"></canvas>
    <div id="hud" class="hud" hidden>
        <div id="xp" class="xpbar"><span></span></div>
        <div class="hud-row">
            <div id="hp" class="hpbar"><span></span></div>
            <b id="level" class="level"></b>
            <b id="timer" class="timer"></b>
            <span id="kills" class="kills"></span>
            <button id="pause" class="icon-button" type="button" aria-label="Pause">⏸️</button>
        </div>
        <button id="bomb" class="bomb-button" type="button" aria-label="Set off a bomb (Space)"><span class="bomb-icon">💣</span><b id="bombs">1</b><small class="bomb-key">Space</small></button>
    </div>
    <div class="sound-buttons">
        <button id="music" class="icon-button" type="button" aria-label="Toggle music">🎵</button>
        <button id="mute" class="icon-button" type="button" aria-label="Toggle sound">🔊</button>
    </div>
    <div id="banner" class="banner" hidden></div>
    <div id="screen" class="screen"></div>
    <div id="modal" class="modal" hidden></div>
    <script type="module" src="/src/games/wither-away/main.ts"></script>
</body>

</html>
