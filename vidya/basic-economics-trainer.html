<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Basic Economics Trainer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Montserrat:wght@500;700;800;900&display=swap">
    <script type="module" src="/src/shared/arcade-button.ts"></script>
</head>

<body>
    <div id="app" data-screen="intro">
        <header class="topbar">
            <div class="brand">
                <span class="brand-cover" aria-hidden="true"><i></i></span>
                <span class="brand-name"><b>Basic Economics</b><small>Trainer</small></span>
            </div>
            <ol id="pips" class="pips" aria-label="Progress"></ol>
            <div class="top-right">
                <span id="score" class="score" aria-live="polite"></span>
                <button id="mute" class="icon-button" type="button" aria-label="Toggle sound">🔊</button>
            </div>
        </header>

        <main class="page">
            <!-- Anya -->
            <section class="panel anya-panel" id="anya-panel">
                <h1 class="caption">Here, take this—maybe it’ll help you stop being dumb</h1>
                <div class="bubble" id="bubble" role="status" aria-live="polite">
                    <p id="bubble-text"></p>
                </div>
                <div class="anya-stage" id="anya-stage">
                    <svg id="anya" class="anya" viewBox="20 30 360 470" role="img" aria-label="Anya, holding out a copy of Basic Economics on a plate"></svg>
                    <span id="sfx" class="sfx" aria-hidden="true"></span>
                </div>
                <button id="take" type="button" class="take-button">Take the book</button>
            </section>

            <!-- The question -->
            <section class="panel quiz-panel" id="quiz-panel" hidden>
                <p class="chapter-line"><span id="chapter" class="chapter"></span><span id="counter" class="counter"></span></p>
                <h2 id="question" class="question"></h2>
                <div id="options" class="options"></div>
                <div class="quiz-footer">
                    <p id="hint" class="hint">Tap an answer, or press 1–4</p>
                    <button id="next" type="button" class="next-button" hidden>Next ▶</button>
                </div>
            </section>

            <!-- The verdict -->
            <section class="panel end-panel" id="end-panel" hidden>
                <p class="end-kicker">Anya’s assessment</p>
                <div id="stamp" class="stamp"></div>
                <p id="final-score" class="final-score"></p>
                <ol id="review" class="review"></ol>
                <p id="best" class="best"></p>
                <button id="again" type="button" class="next-button">Read it again ▶</button>
            </section>
        </main>
    </div>

    <script type="module" src="/src/games/basic-economics-trainer/main.ts"></script>
</body>

</html>
