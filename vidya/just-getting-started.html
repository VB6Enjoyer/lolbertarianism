<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUST GETTING STARTED 😈</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Impact&display=swap');

        :root {
            --primary-red: #ff0000;
            --deep-fry-contrast: 100%;
            --deep-fry-saturate: 100%;
            --shake-intensity: 0px;
        }

        body {
            background-color: #000;
            color: white;
            font-family: 'Impact', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            user-select: none;
            transition: filter 0.5s;
        }

        /* The Deep Fried Vibe */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 50%, rgba(255, 0, 0, 0.2));
            z-index: 10;
            mix-blend-mode: overlay;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 11;
        }

        header {
            text-align: center;
            margin-top: 20px;
            z-index: 20;
            text-shadow: 2px 2px 0 #000;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.5rem;
            color: var(--primary-red);
            text-shadow: 0 0 10px red;
        }

        /* The Boss Avatar */
        .boss-container {
            position: relative;
            margin: 20px auto;
            cursor: pointer;
            transition: transform 0.1s;
            z-index: 20;
        }

        .boss-container:active {
            transform: scale(0.95);
        }

        .boss-emoji {
            font-size: 150px;
            filter: contrast(1.2);
        }

        .laser {
            position: absolute;
            top: 45px;
            width: 800px; /* Long lasers */
            height: 5px;
            background: red;
            box-shadow: 0 0 10px red, 0 0 20px red, 0 0 40px white;
            opacity: 0;
            pointer-events: none;
            transform-origin: left center;
        }

        .laser.left {
            left: 55px;
            transform: rotate(-10deg);
        }

        .laser.right {
            left: 95px;
            transform: rotate(10deg);
        }

        .eye-glow {
            position: absolute;
            top: 45px;
            width: 15px;
            height: 15px;
            background: red;
            border-radius: 50%;
            box-shadow: 0 0 15px red, 0 0 30px red;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        
        .eye-glow.left { left: 52px; }
        .eye-glow.right { left: 92px; }

        /* Stats */
        .stats {
            text-align: center;
            margin-bottom: 20px;
            z-index: 20;
        }

        .money-display {
            font-size: 3rem;
            color: #2ecc71;
            text-shadow: 0 0 10px #2ecc71;
        }

        .cps-display {
            font-size: 1.2rem;
            color: #aaa;
        }

        /* Shop */
        .shop-container {
            flex: 1;
            width: 90%;
            max-width: 600px;
            background: rgba(20, 0, 0, 0.8);
            border: 2px solid var(--primary-red);
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 20px;
            z-index: 20;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }

        .shop-title {
            text-align: center;
            color: var(--primary-red);
            border-bottom: 1px solid var(--primary-red);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111;
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .upgrade-item:hover {
            background: #220000;
            border-color: red;
        }

        .upgrade-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .upgrade-info h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .upgrade-info p {
            margin: 0;
            font-size: 0.8rem;
            color: #888;
        }

        .upgrade-cost {
            color: #ffd700;
            font-weight: bold;
        }

        /* Floating Text Animation */
        .floater {
            position: absolute;
            color: #2ecc71;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
            text-shadow: 1px 1px 0 #000;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* Shake Animation for Intensity */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shaking {
            animation: shake 0.5s;
            animation-iteration-count: infinite;
        }

        /* Deep Fry Intensity Classes */
        .stage-1 { filter: contrast(1.1) saturate(1.2); }
        .stage-2 { filter: contrast(1.3) saturate(1.5) sepia(0.3); }
        .stage-3 { filter: contrast(1.6) saturate(2.0) sepia(0.6) hue-rotate(-10deg); }
        .stage-4 { filter: contrast(2.0) saturate(4.0) sepia(1) hue-rotate(-30deg); background: #100; }

        .meme-text-bottom {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 10px;
            z-index: 20;
            text-shadow: 2px 2px 0 #000;
        }

    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script type="module" src="/src/shared/arcade-button.ts"></script>
</head>
<body>

    <div class="scanlines"></div>
    <div class="overlay"></div>

    <header>
        <h1>LATE STAGE CAPITALISM 😔?</h1>
    </header>

    <div class="stats">
        <div class="money-display">$<span id="money">0</span></div>
        <div class="cps-display">PROFIT/SEC: $<span id="cps">0</span></div>
    </div>

    <!-- The Boss / Click Target -->
    <div class="boss-container" id="boss" onclick="grind()">
        <div class="laser left" id="laser-l"></div>
        <div class="laser right" id="laser-r"></div>
        <div class="eye-glow left" id="eye-l"></div>
        <div class="eye-glow right" id="eye-r"></div>
        <div class="boss-emoji">🕴️</div>
    </div>

    <div class="meme-text-bottom">
        NAH, WE'RE JUST <br><span style="color:red; font-size:2.5rem">GETTING STARTED 😈😤</span>
    </div>

    <div class="shop-container">
        <div class="shop-title">ACQUISITIONS & EXPLOITS</div>
        <div id="shop-list">
            <!-- Upgrades injected here -->
        </div>
    </div>

    <script type="module" src="/src/games/just-getting-started/main.js"></script>
</body>
</html>
