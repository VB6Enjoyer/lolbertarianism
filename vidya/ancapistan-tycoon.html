<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancapistan Tycoon: The Free Market Simulator</title>
    <style>
        :root {
            --ancap-yellow: #F7D02C;
            --ancap-black: #1a1a1a;
            --anime-pink: #FFB7C5;
            --bg-color: #fdfdfd;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Draggable Sticker Background */
        #sticker-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            overflow: hidden;
            pointer-events: none;
            /* Allow clicks to pass through to the UI below */
        }

        .sticker {
            position: absolute;
            cursor: grab;
            transition: transform 0.1s, top 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: bold;
            text-align: center;
            filter: drop-shadow(2px 2px 0px rgba(0, 0, 0, 0.1));
            pointer-events: auto;
            /* Make individual stickers clickable/draggable */
        }

        .sticker:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        .sticker.text {
            background: white;
            padding: 5px 10px;
            border: 2px solid black;
            font-size: 14px;
            max-width: 150px;
        }

        .sticker.img-rep {
            font-size: 40px;
        }

        .sticker.image {
            width: 60px;
            padding: 3px;
            filter: none !important;
        }

        .sticker.image img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        /* The Game UI */
        #game-ui {
            z-index: 5;
            display: flex;
            flex-direction: row;
            height: 100%;
            pointer-events: none;
            /* Let clicks pass through to stickers where empty */
        }

        /* Left Panel: The Clicker */
        .panel {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            border: 4px solid var(--ancap-black);
            margin: 20px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 8px 8px 0px var(--ancap-yellow);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #clicker-panel {
            flex: 1;
            justify-content: center;
            min-width: 300px;
        }

        #shop-panel {
            flex: 1;
            overflow-y: auto;
            min-width: 300px;
        }

        h1 {
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            color: var(--ancap-black);
            text-shadow: 2px 2px 0px var(--ancap-yellow);
        }

        .score-display {
            font-size: 2.5rem;
            margin: 20px 0;
            color: green;
            font-family: monospace;
            font-weight: bold;
        }

        .sub-score {
            font-size: 1rem;
            color: #666;
            margin-bottom: 20px;
        }

        /* The Big Button */
        #main-btn {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, var(--ancap-yellow) 50%, var(--ancap-black) 50%);
            border-radius: 50%;
            border: 5px solid black;
            font-size: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
            overflow: hidden;
        }

        #main-btn:active {
            transform: scale(0.95);
        }

        #main-btn::after {
            content: "DONT TREAD";
            position: absolute;
            bottom: 20px;
            font-size: 16px;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }

        /* Shop Items */
        .shop-item {
            width: 100%;
            background: white;
            border: 2px solid black;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .shop-item:hover {
            background: #fffbe6;
        }

        .shop-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #eee;
        }

        #special-upgrades-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--ancap-black);
        }

        .special-upgrade {
            flex: 1;
            background: #fff;
            border: 2px solid var(--ancap-black);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .special-upgrade:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        .special-upgrade.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #ddd;
            transform: none;
            box-shadow: none;
        }

        .special-upgrade-icon {
            font-size: 30px;
        }

        .special-upgrade-name {
            font-size: 0.8em;
            font-weight: bold;
            margin: 5px 0;
        }

        .special-upgrade-cost {
            font-size: 0.7em;
            color: #d35400;
        }

        .item-icon {
            font-size: 24px;
            margin-right: 10px;
        }

        .item-icon img {
            height: 40px;
            /* Match font size */
            width: auto;
            vertical-align: middle;
            /* Align with text */
        }

        .item-info {
            flex-grow: 1;
            text-align: left;
        }

        .item-name {
            font-weight: bold;
            display: block;
        }

        .item-cost {
            color: #d35400;
            font-size: 0.9em;
        }

        /* Floating Text Animation */
        .floater {
            position: absolute;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
            text-shadow: 1px 1px 0 #fff;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-50px) scale(1.5);
                opacity: 0;
            }
        }

        /* Tax Raid Event */
        #raid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.5);
            z-index: 999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: flash 0.5s infinite;
        }

        @keyframes flash {
            0% {
                background: rgba(255, 0, 0, 0.3);
            }

            50% {
                background: rgba(255, 0, 0, 0.6);
            }

            100% {
                background: rgba(255, 0, 0, 0.3);
            }
        }

        #raid-box {
            background: white;
            padding: 30px;
            border: 5px solid red;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 20px red;
        }

        .btn-evade {
            background: var(--ancap-black);
            color: var(--ancap-yellow);
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
        }

        .btn-evade:hover {
            transform: scale(1.05);
        }

        .btn-reshuffle {
            background: var(--ancap-black);
            color: var(--ancap-yellow);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
            font-family: inherit;
        }

        .btn-reshuffle:hover {
            transform: scale(1.05);
        }

        /* CSS Shapes for Flags */
        .flag-ancap {
            width: 70px;
            height: 50px;
            background: linear-gradient(135deg, var(--ancap-yellow) 50%, var(--ancap-black) 50%);
            border: 1px solid black;
            display: inline-block;
        }

        .flag-eu-cross {
            width: 60px;
            height: 40px;
            background: #003399;
            position: relative;
            border: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .flag-eu-cross::after {
            content: "❌";
            position: absolute;
            font-size: 25px;
            color: red;
            opacity: 0.7;
        }

        /* Responsive */
        @media (max-width: 800px) {
            #game-ui {
                flex-direction: column;
            }

            .panel {
                margin: 10px;
                padding: 10px;
                flex: 1;
            }

            #main-btn {
                width: 150px;
                height: 150px;
                font-size: 60px;
            }
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script type="module" src="/src/shared/arcade-button.ts"></script>
</head>

<body>

    <!-- Draggable Background Elements (The Collage) -->
    <div id="sticker-container">
        <!-- Generated via JS for randomness -->
    </div>

    <!-- Main Game UI -->
    <div id="game-ui">
        <!-- Left: Clicker -->
        <div class="panel" id="clicker-panel">
            <h1>Ancapistan Tycoon</h1>
            <p style="font-size: 0.8em; color: #888;">"Taxation is Theft"</p>

            <div class="score-display">$<span id="score">0</span></div>
            <div class="sub-score">$<span id="income">0</span> / sec</div>

            <div id="main-btn" onclick="clickMain()">
                🐍
            </div>

            <div style="margin-top: 20px; text-align: center;">
                <p><i>"I owe my rights to Libertarians &lt;3"</i></p>
                <div style="font-size: 30px; display: flex; align-items: center; justify-content: center; gap: 0.2em;">
                    🗽 🪙 <img src="img/pistol.png" style="height: 1em; pointer-events: none;">
                </div>
            </div>

            <button class="btn-reshuffle" onclick="reshuffleStickers()">Reshuffle Stickers</button>
        </div>

        <!-- Right: Shop -->
        <div class="panel" id="shop-panel">
            <h2>The Free Market</h2>
            <div id="special-upgrades-container">
                <!-- Special upgrades injected here -->
            </div>
            <div id="shop-list">
                <!-- Shop items injected here -->
            </div>
        </div>
    </div>

    <!-- Raid Event Overlay -->
    <div id="raid-overlay">
        <div id="raid-box">
            <h1>🚨 THE FED IS HERE! 🚨</h1>
            <p>They want to audit your crypto wallet!</p>
            <p style="font-size: 40px;">👮‍♂️🚔📉</p>
            <button class="btn-evade" onclick="evadeTax()">HIDE ASSETS!</button>
        </div>
    </div>

    <script type="module" src="/src/games/ancapistan-tycoon/main.js"></script>
</body>

</html>
