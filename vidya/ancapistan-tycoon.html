<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancapistan Tycoon: The Free Market Simulator</title>
    <link rel="stylesheet" href="/src/games/ancapistan-tycoon/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script type="module" src="/src/shared/arcade-button.ts"></script>
</head>

<body>

    <!-- Draggable Background Elements (The Collage) -->
    <div id="sticker-container">
        <!-- Generated via JS for randomness -->
    </div>

    <!-- Main Game UI -->
    <div id="game-ui">
        <!-- Left: Clicker -->
        <div class="panel" id="clicker-panel">
            <div class="news-ticker">
                <span class="news-label">📰 NEWS</span>
                <div class="news-track" id="news-track"><span class="news-text" id="news-text"></span></div>
                <button class="sound-toggle" id="btn-sound" aria-label="Mute sound" title="Mute sound">🔊</button>
            </div>
            <div class="challenge-banner" id="challenge-banner" hidden>
                <div class="challenge-banner-top">
                    <span class="challenge-name" id="challenge-name"></span>
                    <button class="challenge-abandon" id="btn-abandon">Abandon</button>
                </div>
                <div class="challenge-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="challenge-progress">
                    <div class="challenge-progress-fill" id="challenge-fill"></div>
                </div>
                <div class="challenge-details" id="challenge-details"></div>
            </div>
            <h1>Ancapistan Tycoon</h1>
            <p style="font-size: 0.8em; color: #888;">"Taxation is Theft"</p>

            <div class="score-display">$<span id="score">0</span></div>
            <div class="sub-score">$<span id="income">0</span> / sec</div>
            <div class="prestige-line" id="prestige-line" role="button" tabindex="0" title="See your cities" hidden></div>
            <div class="buff-bar" id="buff-bar" aria-live="polite"></div>

            <div class="main-btn-wrap">
                <div id="main-btn" role="button" tabindex="0" aria-label="Click for money">
                    🐍
                </div>
                <img class="santa-hat" id="santa-hat" src="img/santa-hat.webp" alt="" hidden>
            </div>
            <button class="event-chip" id="event-chip" hidden></button>

            <div style="margin-top: 20px; text-align: center;">
                <p><i>"I owe my rights to Libertarians &lt;3"</i></p>
                <div style="font-size: 30px; display: flex; align-items: center; justify-content: center; gap: 0.2em;">
                    🗽 🪙 <img src="img/pistol.webp" style="height: 1em; pointer-events: none;">
                </div>
            </div>

            <div class="btn-row">
                <button class="btn-reshuffle" id="btn-reshuffle" hidden>Reshuffle Stickers</button>
                <button class="btn-reshuffle" id="btn-stickers">🎨 Stickers</button>
                <button class="btn-reshuffle" id="btn-achievements">🏆 Achievements</button>
                <button class="btn-reshuffle" id="btn-stats">📊 Stats</button>
                <button class="btn-reshuffle btn-secede" id="btn-secede">🏴 Secede</button>
                <button class="btn-reshuffle" id="btn-charters" hidden>📜 Charters</button>
                <button class="btn-reshuffle" id="btn-challenges" hidden>🏁 Challenges</button>
            </div>
        </div>

        <!-- Right: Shop -->
        <div class="panel" id="shop-panel">
            <h2>The Free Market</h2>
            <div id="special-upgrades-container">
                <!-- Special upgrades injected here -->
            </div>
            <div class="buy-amount" id="buy-amount" role="group" aria-label="How many to buy">
                <span class="buy-mode">
                    <button data-mode="buy" class="active">Buy</button>
                    <button data-mode="sell">Sell</button>
                </span>
                <button data-amount="1">×1</button>
                <button data-amount="10">×10</button>
                <button data-amount="max">MAX</button>
            </div>
            <div id="shop-list">
                <!-- Shop items injected here -->
            </div>
        </div>
    </div>

    <!-- Raid Event Overlay -->
    <div id="raid-overlay">
        <div id="raid-box">
            <h1 id="raid-title">🚨 THE FED IS HERE! 🚨</h1>
            <p id="raid-text">They want to audit your crypto wallet!</p>
            <p style="font-size: 40px;">👮‍♂️🚔📉</p>
            <button class="btn-evade" id="btn-evade">HIDE ASSETS!</button>
        </div>
    </div>

    <!-- Dialogs: offline earnings, secession, achievements -->
    <div class="modal" id="modal" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

    <!-- Achievement toasts -->
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="/src/games/ancapistan-tycoon/main.ts"></script>
</body>

</html>
