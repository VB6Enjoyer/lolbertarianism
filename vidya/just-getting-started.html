<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JUST GETTING STARTED 😈</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap">
    <script type="module" src="/src/shared/arcade-button.ts"></script>
</head>

<body>
    <div id="app" class="fry-0">
        <header class="topbar">
            <button id="home" class="brand" type="button" title="Back to the title screen">LATE STAGE? <b>NAH.</b></button>
            <div id="hud" class="hud" aria-live="polite"></div>
            <button id="options" class="icon-button" type="button" aria-label="Options">⚙️</button>
            <button id="mute" class="icon-button" type="button" aria-label="Toggle sound">🔊</button>
        </header>
        <main id="screen" class="screen"></main>
        <div id="overlay" class="overlay" hidden></div>
        <div id="toasts" class="toasts" aria-live="polite"></div>
        <div class="vignette" aria-hidden="true"></div>
        <div class="scanlines" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/games/just-getting-started/main.ts"></script>
</body>

</html>
